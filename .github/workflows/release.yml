name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify release tag and npm version
        run: |
          expected_ref="refs/tags/v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF" != "$expected_ref" ]; then
            echo "Dispatch this workflow from $expected_ref, not $GITHUB_REF."
            exit 1
          fi
          npm --version | awk -F. '{ if ($1 < 11 || ($1 == 11 && $2 < 5)) exit 1 }'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check source and fixtures
        run: |
          bun run check
          bun run check:fixtures
      - name: Inspect package and dependencies
        run: |
          bun run package:check
          bun audit --audit-level low
      - name: Publish package
        run: npm publish --access public --provenance
